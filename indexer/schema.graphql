type Till {
  id: ID! # till address, lowercase
  owner: String!
  label: String!
  retired: Boolean!
  registeredAt: BigInt!
}

type Transfer {
  id: ID! # txHash:logIndex
  txHash: String!
  # Which accepted stablecoin (USDC or USDT0).
  token: String!
  from: String!
  to: String!
  value: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  # The till involved (recipient for a sale, sender for a refund or sweep).
  till: String!
  owner: String!
}
